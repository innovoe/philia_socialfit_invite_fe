# Drop these inside the invite.socialfit.philia.life server { } block.
# Then: sudo nginx -t && sudo systemctl reload nginx
#
# Also copy onto the web root (next to index.html):
#   favicon.ico
#   apple-touch-icon.png
#   favicon/

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    application/manifest+json
    image/svg+xml;

location = /favicon.ico {
    try_files /favicon.ico =204;
    access_log off;
    log_not_found off;
    expires 30d;
    add_header Cache-Control "public";
}

location = /apple-touch-icon.png {
    try_files /apple-touch-icon.png =204;
    access_log off;
    log_not_found off;
    expires 30d;
    add_header Cache-Control "public";
}

location = /apple-touch-icon-precomposed.png {
    try_files /apple-touch-icon.png =204;
    access_log off;
    log_not_found off;
    expires 30d;
    add_header Cache-Control "public";
}

location ^~ /favicon/ {
    expires 30d;
    add_header Cache-Control "public";
    access_log off;
    log_not_found off;
}
